<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TransDash</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f1fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111015" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the theme before first paint so the page never flashes the wrong
      // one. Same rule as src/lib/theme.svelte.ts: saved choice, else the OS.
      try {
        var saved = localStorage.getItem('transdash-theme');
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
    </script>

    <!-- iOS "Add to Home Screen" support (Safari ignores the manifest) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TransDash" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
